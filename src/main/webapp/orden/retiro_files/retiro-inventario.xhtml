<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
			
			<p:panel>
				<div style="padding-bottom: 0.6rem;">
					<p:outputLabel value="Buscar por fecha de ingreso, folio de entrada, producto, contenedor, lote o caducidad" style="font-style: italic; font-weight: bold;" />
				</div>
				<div>
				    <span>
				    	<p:selectBooleanButton value="#{mbEmisionSalidas.allTerms}" onIcon="pi pi-circle-on" onLabel="Buscar con todos los términos" offIcon="pi pi-circle-off" offLabel="Buscar con alguno de los términos">
				    		<p:ajax process="@this" listener="#{mbEmisionSalidas.handleAllTerms()}" update="dt-products" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"></p:ajax>
				    	</p:selectBooleanButton>
				    </span>
				    <p:spacer style="width: 1rem;" />
					<span class="ui-input-icon-left">
				        <i class="pi pi-search" />
						<p:inputText value="#{mbEmisionSalidas.query}" placeholder="Escriba un término">
							<p:ajax event="keyup" delay="700" process="@this" listener="#{mbEmisionSalidas.handleQuery()}" update="dt-products" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();"/>
						</p:inputText>
				    </span>
				</div>
			</p:panel>
			
			<p:dataTable id="dt-products" widgetVar="dtProducts" var="inventario" value="#{mbEmisionSalidas.mostrarInventario()}" size="small"
				rowKey="#{inventario.partidaClave}"
				paginator="true" rows="10" rowSelectMode="add" paginatorPosition="bottom">
				
				<p:column width="1rem">
	                <p:rowToggler/>
	            </p:column>
				<p:column headerText="Folio" sortBy="#{inventario.folioCliente}" width="6rem" filterable="true">
					<h:outputText value="#{inventario.folioCliente}" />
				</p:column>
				<p:column headerText="Ingreso" sortBy="#{inventario.fechaIngreso}" width="6rem">
					<p:outputLabel value="#{inventario.fechaIngreso}">
						<f:convertDateTime locale="es_MX" pattern="dd/MM/yyyy" timeZone="GMT-6" />
					</p:outputLabel>
				</p:column>
				<p:column headerText="Producto" sortBy="#{inventario.producto}" width="auto" >
					<p:badge severity="warning" value="#{inventario.cantidadReservada}" visible="#{inventario.cantidadReservada ne null}" styleClass="mr-2">
						<h:outputText value="#{inventario.producto}" />
					</p:badge>
				</p:column>
				<p:column headerText="Existencia" width="6rem" style="text-align: right;">
					<h:outputText value="#{inventario.existencia} #{inventario.unidad}">
					</h:outputText>
				</p:column>
				<p:column headerText="Peso (Kg)" width="6rem" style="text-align: right;">
					<h:outputText value="#{inventario.peso}"/>
				</p:column>
				<p:column width="2rem" style="text-align: right;">
					<p:commandButton icon="pi pi-plus" process="@this" update="form:pnl-detalle-retiro" onclick="PF('statusInfoDialog').show()" oncomplete="PF('statusInfoDialog').hide();PF('dlgDetalleRetiro').show();" disabled="#{mbEmisionSalidas.bloquearRetiro(inventario)}">
						<f:setPropertyActionListener value="#{inventario}" target="#{mbEmisionSalidas.inventario}" />
					</p:commandButton>
				</p:column>
				<p:rowExpansion>
					<div class="p-grid ui-fluid">
						<div class="p-col-2 p-md-2">
							<p:outputLabel for="@next" value="Código" />
							<p:inputText value="#{inventario.codigo}" readonly="true" />
						</div>
						<div class="p-col-2 p-md-2">
							<p:outputLabel for="@next" value="Caducidad"/>
							<p:datePicker value="#{inventario.caducidad}" locale="es_MX" pattern="dd/MM/yyyy" timeZone="GMT-6" readonly="true"/>
						</div>
						<div class="p-col-2 p-md-2">
							<p:outputLabel for="@next" value="Lote"/>
							<p:inputText value="#{inventario.lote}" readonly="true" />
						</div>
						<div class="p-col-2 p-md-2">
							<p:outputLabel for="@next" value="Contenedor"/>
							<p:inputText value="#{inventario.sap}" readonly="true" />
						</div>
					</div>
				</p:rowExpansion>
				<p:columnGroup type="footer">
					<p:row>
						<p:column style="text-align: left;"/>
						<p:column style="text-align: left;"/>
						<p:column style="text-align: left;"/>
						<p:column footerText="#{mbEmisionSalidas.numeroProductos()} seleccionado#{mbEmisionSalidas.numeroProductos() ne 1 ? 's' : ''}" style="text-align: left;"/>
						<p:column colspan="2" footerText="#{mbEmisionSalidas.cantidadPendiente()} por confirmar" style="text-align: right;"/>
						<p:column style="text-align: left;"/>
					</p:row>
				</p:columnGroup>
			</p:dataTable>

</ui:composition>
