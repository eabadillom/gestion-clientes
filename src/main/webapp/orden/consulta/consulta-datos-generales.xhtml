<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <p:panel id="pnl-datos-generales" header="Datos generales">
        <div class="p-grid ui-fluid">
            <div class="p-col-12 p-md-6">
                <p:outputLabel for="nombreCliente" value="Cliente" />
                <p:inputText id="nombreCliente" placeholder="#{consultarSalidas.cliente.nombre}" readonly="true" />
            </div>
            <div class="p-col-6 p-md-3">
                <p:outputLabel for="fechaInicio" value="Del" />
                <p:datePicker id="fechaInicio" showIcon="true" required="true" value="#{consultarSalidas.fechaInicio}" 
                    pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6" >
                    <p:ajax process="@this" />
                </p:datePicker>
            </div>
            <div class="p-col-6 p-md-3">
                <p:outputLabel for="fechaFin" value="al" />
                <p:datePicker id="fechaFin" showIcon="true" required="true" value="#{consultarSalidas.fechaFin}" 
                    pattern="dd/MM/yyyy" locale="es" timeZone="GMT-6" >
                    <p:ajax process="@this" />
                </p:datePicker>
            </div>
            <div class="p-col-4 p-md-2">
                <p:commandButton value="Consultar " icon="pi pi-search" process="@this" actionListener="#{consultarSalidas.consultarSalidas}" 
                    update="dt-salidas" onstart="PF('statusInfoDialog').show();" oncomplete="PF('statusInfoDialog').hide();" />
            </div>
        </div>
    </p:panel>                
</ui:composition>
